<script>
  // Fake gtag consent state (what google_tag_data.ics looks like at runtime).
  function consentCookie() { var m = document.cookie.match(/(?:^|; )fx_consent=(\w+)/); return m ? m[1] : null; }
  var c = consentCookie();
  window.google_tag_data = { ics: { entries: {
    ad_storage: { default: false, update: c === "granted" ? true : c === "denied" ? false : undefined },
    analytics_storage: { default: false, update: c === "granted" ? true : c === "denied" ? false : undefined }
  } } };
  window.dataLayer = window.dataLayer || [];
  dataLayer.push({ event: "page_meta", user_email: "jane.doe@example.com", phone: "+33 6 12 34 56 78", order: 42 });
  function hit(en, gcs) {
    navigator.sendBeacon("/g/collect?v=2&tid=G-TEST&en=" + en + "&gcs=" + gcs, "en=" + en);

  <button id="acc" type="button">Accept all</button>
  <button id="rej" type="button">Reject all</button>
</div>
<script>
  var banner = document.getElementById("cookie-banner");
  if (!consentCookie()) banner.classList.remove("hidden");
  function decide(v) {
    document.cookie = "fx_consent=" + v + "; path=/";
    window.google_tag_data.ics.entries.ad_storage.update = v === "granted";
    window.google_tag_data.ics.entries.analytics_storage.update = v === "granted";
    dataLayer.push({ event: "consent_update", value: v });
    banner.classList.add("hidden");
    hit(v === "granted" ? "consent_granted" : "consent_denied", v === "granted" ? "G111" : "G100");
  }
  document.getElementById("acc").addEventListener("click", function () { decide("granted"); });
  document.getElementById("rej").addEventListener("click", function () { decide("denied"); });
</script>
